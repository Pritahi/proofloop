<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaunchPad - demo app under test</title>
<style>
  body { font:16px/1.5 -apple-system,Segoe UI,sans-serif; background:#f6f8fa; color:#1f2328; margin:0; }
  .wrap { max-width:520px; margin:60px auto; background:#fff; border:1px solid #d0d7de; border-radius:12px; padding:32px; }
  h1 { margin:0 0 4px; font-size:24px; }
  p.sub { color:#57606a; margin:0 0 20px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #d0d7de; border-radius:8px; font:inherit; margin-bottom:12px; }
  button { width:100%; padding:12px; background:#1f883d; color:#fff; border:0; border-radius:8px; font-size:16px; font-weight:700; cursor:pointer; }
  #welcome { display:none; margin-top:20px; padding:16px; background:#dafbe1; border:1px solid #2da44e; border-radius:8px; font-weight:600; }
  #err { display:none; margin-top:20px; padding:16px; background:#ffebe9; border:1px solid #cf222e; border-radius:8px; }
  .badge { font-size:12px; color:#57606a; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LaunchPad</h1>
  <p class="sub">The waiting list for the demo SaaS. Join and get your welcome message.</p>
  <form id="signup">
    <input id="email" type="email" placeholder="you@company.com" required aria-label="Email address">
    <button type="submit" id="join">Join the waiting list</button>
  </form>
  <div id="welcome" role="status">Welcome aboard! Your invite is on its way.</div>
  <div id="err" role="alert">Something went wrong. Please try again.</div>
  <div class="badge">ProofLoop demo target. Add ?bug=1 to ship the broken build.</div>
</div>
<script>
// The "buggy build": with ?bug=1 the join button silently does nothing -
// the exact class of bug a non-technical founder ships and never notices.
const BUG = new URLSearchParams(location.search).get('bug') === '1';
document.getElementById('signup').addEventListener('submit', (e) => {
  e.preventDefault();
  if (BUG) { document.getElementById('welcome').style.display = 'none'; document.getElementById('err').style.display = 'block'; return; } // signup API "fails": user sees an error
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  document.getElementById('welcome').style.display = 'block';
});
</script>
</body>
</html>
